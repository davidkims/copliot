name: "🗒️ EchoOps — All Services MAX (Discover+cURL+Build/Test+Docker+Scan+Push+K8s+Always-Logs)"

on:
  workflow_dispatch:
    inputs:
      services_glob:
        description: "서비스 폴더 glob (공백/줄바꿈으로 여러 개 지정)"
        required: false
        default: "services/* apps/*"
      run_tests:
        description: "테스트 실행"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      enable_security_scan:
        description: "컨테이너 SBOM/취약점 스캔(Syft/Trivy)"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      docker_registry:
        description: "레지스트리"
        required: true
        type: choice
        options: ["docker.io", "ghcr.io", "quay.io"]
        default: "docker.io"
      docker_push:
        description: "Docker push 수행(로그인 필요)"
        required: true
        type: choice
        options: ["true", "false"]
        default: "false"
      image_prefix:
        description: "이미지 접두사(예: user/ 또는 org/team/)"
        required: false
        default: ""
      node_version:
        description: "Node 버전"
        required: false
        default: "20.x"
      k8s_lint:
        description: "kubeconform로 매니페스트 검사"
        required: true
        type: choice
        options: ["true", "false"]
        default: "true"
      allow_domains_csv:
        description: "허용 도메인 CSV(미지정 시 기본 화이트리스트)"
        required: false
        default: ""
      download_manifest_root:
        description: "루트 매니페스트 경로(.ci/downloads.txt 등)"
        required: false
        default: ".ci/downloads.txt"

  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  packages: write

env:
  ECHO_OK:  "[OK]"
  ECHO_WARN: "[WARN]"
  ECHO_FAIL: "[FAIL]"

jobs:
  guard:
    name: "Guard — bot skip / base env"
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.flag.outputs.proceed }}
    steps:
      - name: Bootstrap dirs & echo files (safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:=/tmp}"
          LOG_DIR="${RUNNER_TEMP}/runtime-logs"
          ART_DIR="${RUNNER_TEMP}/artifacts"
          DL_DIR="${RUNNER_TEMP}/downloads"
          ECHO_DIR=".github/echo"
          mkdir -p "$LOG_DIR" "$ART_DIR" "$DL_DIR" "$ECHO_DIR" "$ECHO_DIR/logs" "$ECHO_DIR/reports"
          : > "$LOG_DIR/.keep"; : > "$ART_DIR/.keep"; : > "$DL_DIR/.keep"
          printf 'EchoOps initialized at %sZ\n' "$(date -u +%F-%T)" > "$ECHO_DIR/logs/init.txt"
          : > "$ECHO_DIR/reports/.keep"; : > "$LOG_DIR/echo-run.log"; : > "$LOG_DIR/guard.out"; : > "$LOG_DIR/placeholder.txt"
          {
            echo "LOG_DIR=$LOG_DIR"
            echo "ART_DIR=$ART_DIR"
            echo "DL_DIR=$DL_DIR"
            echo "ECHO_DIR=$ECHO_DIR"
          } >> "$GITHUB_ENV"
          {
            echo "### Bootstrap"
            echo "- LOG_DIR: \`$LOG_DIR\`"
            echo "- ART_DIR: \`$ART_DIR\`"
            echo "- DL_DIR: \`$DL_DIR\`"
            echo "- ECHO_DIR: \`$ECHO_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: flag
        name: Decide proceed (skip Copilot bot)
        shell: bash
        run: |
          if [ "${{ github.actor }}" = "copilot-swe-agent[bot]" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "copilot bot → skip" | tee -a "${LOG_DIR}/guard.out"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "run by ${{ github.actor }}" | tee -a "${LOG_DIR}/guard.out"
          fi

      - name: Upload guard logs (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: guard
          path: ${{ env.LOG_DIR }}/*
          if-no-files-found: ignore
          retention-days: 7

  discover:
    name: "Discover — services & manifests"
    needs: [guard]
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - name: Bootstrap dirs & echo files (safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:=/tmp}"
          LOG_DIR="${RUNNER_TEMP}/runtime-logs"
          ART_DIR="${RUNNER_TEMP}/artifacts"
          DL_DIR="${RUNNER_TEMP}/downloads"
          ECHO_DIR=".github/echo"
          mkdir -p "$LOG_DIR" "$ART_DIR" "$DL_DIR" "$ECHO_DIR" "$ECHO_DIR/logs" "$ECHO_DIR/reports"
          : > "$LOG_DIR/.keep"; : > "$ART_DIR/.keep"; : > "$DL_DIR/.keep"
          : > "$LOG_DIR/echo-run.log"
          {
            echo "LOG_DIR=$LOG_DIR"
            echo "ART_DIR=$ART_DIR"
            echo "DL_DIR=$DL_DIR"
            echo "ECHO_DIR=$ECHO_DIR"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - id: mk
        name: Scan service dirs
        shell: bash
        run: |
          set -Eeuo pipefail
          # 1) 입력이 비었을 때 기본 glob 보강 (push 등)
          G="${{ inputs.services_glob }}"
          if [ -z "${G:-}" ]; then
            G="services/* apps/*"
          fi
          # 2) glob 분해
          mapfile -t GLOBS < <(printf '%s\n' "$G" | tr ' ' '\n' | sed '/^$/d')
          SERVICES=()
          # 3) 서비스 후보 스캔
          for g in "${GLOBS[@]}"; do
            for p in $g; do
              [ -d "$p" ] || continue
              if compgen -G "$p/pom.xml"           >/dev/null || \
                 compgen -G "$p/build.gradle*"     >/dev/null || \
                 compgen -G "$p/package.json"      >/dev/null || \
                 compgen -G "$p/pyproject.toml"    >/dev/null || \
                 compgen -G "$p/requirements.txt"  >/dev/null || \
                 compgen -G "$p/go.mod"            >/dev/null || \
                 compgen -G "$p/Cargo.toml"        >/dev/null || \
                 compgen -G "$p/*.csproj"          >/dev/null || \
                 compgen -G "$p/Dockerfile*"       >/dev/null || \
                 [ -f "$p/downloads.txt" ]; then
                SERVICES+=("$p")
              fi
            done
          done
          # 4) 없으면 루트(".")라도
          [[ ${#SERVICES[@]} -eq 0 ]] && SERVICES+=(".")
          # 5) matrix JSON을 단일 줄(compact)로 생성
          MATRIX_JSON=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s . | jq -c '{service: .}')
          echo "$MATRIX_JSON" | tee "${LOG_DIR}/services.json"
          # 6) Outputs에 안전하게 기록(한 줄)
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          # 7) 요약
          {
            echo "### Discover"
            echo "- patterns: \`$G\`"
            echo "- found: ${#SERVICES[@]} service(s)"
            for s in "${SERVICES[@]}"; do echo "  - \`$s\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery logs (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discover
          path: ${{ env.LOG_DIR }}/*
          if-no-files-found: ignore
          retention-days: 7

  service:
    name: "Service — cURL + Build/Test per stack + Container + Scan + Push"
    needs: [discover]
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SERVICE_DIR: ${{ matrix.service }}
    steps:
      - name: Bootstrap dirs & echo files (safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:=/tmp}"
          LOG_DIR="${RUNNER_TEMP}/runtime-logs"
          ART_DIR="${RUNNER_TEMP}/artifacts"
          DL_DIR="${RUNNER_TEMP}/downloads"
          ECHO_DIR=".github/echo"
          mkdir -p "$LOG_DIR" "$ART_DIR" "$DL_DIR" "$ECHO_DIR" "$ECHO_DIR/logs" "$ECHO_DIR/reports"
          : > "$LOG_DIR/.keep"; : > "$ART_DIR/.keep"; : > "$DL_DIR/.keep"
          : > "$LOG_DIR/echo-run.log"
          {
            echo "LOG_DIR=$LOG_DIR"
            echo "ART_DIR=$ART_DIR"
            echo "DL_DIR=$DL_DIR"
            echo "ECHO_DIR=$ECHO_DIR"
          } >> "$GITHUB_ENV"

      - name: Compute safe service name
        shell: bash
        run: |
          RAW="${{ matrix.service }}"
          SAFE=$(printf "%s" "$RAW" | sed -e 's|[ /:\\]|_|g' -e 's|__*|_|g' -e 's|^_$|root|')
          [ -n "$SAFE" ] || SAFE="root"
          echo "SAFE_SERVICE=$SAFE" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      # ===== Toolchains =====
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install kubeconform/syft/trivy (best-effort)
        run: |
          set +e
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o /tmp/kc.tgz && tar -xzf /tmp/kc.tgz -C /tmp && sudo mv /tmp/kubeconform /usr/local/bin/kubeconform || true
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin || true
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin || true

      - name: Define echo & curl helpers
        shell: bash
        run: |
          cat <<'SH' > /tmp/echo_helpers.sh
          set -o pipefail
          echoe(){ printf '%s %s\n' "${ECHO_OK}" "$*"; }
          warn(){  printf '%s %s\n' "${ECHO_WARN}" "$*"; }
          fail(){  printf '%s %s\n' "${ECHO_FAIL}" "$*"; }
          logf(){  printf '%s\n' "$*" | tee -a "${LOG_DIR}/echo-${SAFE_SERVICE}.log"; }
          run_cmd(){
            logf "▶ $*"
            eval "$@" 2>&1 | tee -a "${LOG_DIR}/echo-${SAFE_SERVICE}.log"
            local rc=${PIPESTATUS[0]}
            if [ $rc -eq 0 ]; then echoe "DONE: $*"; else warn "RC=$rc ← $*"; fi
            return $rc
          }
          curl_get(){
            local url="$1"; local out="$2"; local want_sha="$3"
            local allow="${ALLOW_DOMAINS_CSV:-}"
            local host; host=$(printf '%s' "$url" | awk -F/ '{print $3}')
            if [ -z "$host" ]; then warn "invalid url: $url"; return 1; fi
            local allowed=0
            if [ -n "$allow" ]; then
              IFS=',' read -ra arr <<< "$allow"
              for d in "${arr[@]}"; do [[ "$host" == *"$d"* ]] && allowed=1 && break; done
            else
              case "$host" in
                github.com|raw.githubusercontent.com|objects.githubusercontent.com|\
                nodejs.org|registry.npmjs.org|dl.google.com|storage.googleapis.com|\
                packages.githubusercontent.com|releases.hashicorp.com|get.helm.sh|\
                dl.k8s.io|cdn.kernel.org|download.docker.com|download.jetbrains.com|\
                go.dev|golang.org|python.org|files.pythonhosted.org|pypi.org|\
                repo.maven.apache.org|downloads.apache.org|quay.io|ghcr.io|\
                registry-1.docker.io|archive.apache.org) allowed=1;;
              esac
            fi
            if [ $allowed -ne 1 ]; then warn "blocked host: $host"; return 2; fi
            mkdir -p "$(dirname "$out")"
            local opts=( -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 600 --compressed )
            logf "⤓ $url -> $out"
            curl "${opts[@]}" -H "User-Agent: EchoOps/1.0 (+GitHubActions)" "$url" -o "$out"
            local rc=$?; if [ $rc -ne 0 ]; then warn "curl rc=$rc: $url"; return $rc; fi
            if [ -n "$want_sha" ]; then
              local got; got=$(sha256sum "$out" | awk '{print $1}')
              local exp="${want_sha#SHA256=}"
              if [ "$got" != "$exp" ]; then rm -f "$out"; fail "sha256 mismatch: $out"; return 3; fi
            fi
            echoe "download ok: $out"
          }
          SH
          . /tmp/echo_helpers.sh
          echoe "helpers ready"
          [ -n "${{ inputs.allow_domains_csv }}" ] && echo "ALLOW_DOMAINS_CSV=${{ inputs.allow_domains_csv }}" >> "$GITHUB_ENV"

      - name: Read & run download manifests (root + service)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          ROOT_MANIFEST: ${{ inputs.download_manifest_root }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          declare -a manifests=()
          if [ -f "${GITHUB_WORKSPACE}/${ROOT_MANIFEST}" ]; then manifests+=("${GITHUB_WORKSPACE}/${ROOT_MANIFEST}"); fi
          if [ -f "downloads.txt" ]; then manifests+=("downloads.txt"); fi
          if [ ${#manifests[@]} -eq 0 ]; then
            warn "no download manifests — skip curl"
          else
            for mf in "${manifests[@]}"; do
              echoe "processing manifest: $mf"
              while IFS= read -r line || [ -n "$line" ]; do
                line="${line%%#*}"; [[ -z "$line" ]] && continue
                url=$(awk '{print $1}' <<<"$line"); dest=$(awk '{print $2}' <<<"$line"); sha=$(awk '{print $3}' <<<"$line")
                if [[ -z "$url" || -z "$dest" ]]; then warn "malformed line: $line"; continue; fi
                out1="${DL_DIR}/${{ matrix.service }}/$dest"
                run_cmd "mkdir -p '$(dirname "$out1")'"
                curl_get "$url" "$out1" "$sha" || continue
                if [[ "$dest" != /* ]]; then
                  out2="${GITHUB_WORKSPACE}/${{ env.SERVICE_DIR }}/$dest"
                  run_cmd "mkdir -p '$(dirname "$out2")'"
                  run_cmd "cp -f '$out1' '$out2'"
                fi
              done < "$mf"
            done
          fi

      # ========== Node ==========
      - name: Detect Node PM & prepare (echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          . /tmp/echo_helpers.sh
          if [ -f pnpm-lock.yaml ]; then
            run_cmd "corepack enable"
            run_cmd "corepack prepare pnpm@latest --activate"
            echo "PM=pnpm" >> "$GITHUB_ENV"
          elif [ -f yarn.lock ]; then
            run_cmd "corepack enable"
            run_cmd "corepack prepare yarn@stable --activate"
            echo "PM=yarn" >> "$GITHUB_ENV"
          else
            echo "PM=npm" >> "$GITHUB_ENV"; echoe "Using npm"
          fi

      - name: Node build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if [ -f package.json ]; then
            case "${PM}" in
              pnpm) run_cmd "pnpm i | tee '${LOG_DIR}/node-install-${SAFE_SERVICE}.log'";;
              yarn) run_cmd "yarn install --immutable | tee '${LOG_DIR}/node-install-${SAFE_SERVICE}.log'";;
              npm)  run_cmd "npm ci || npm i | tee '${LOG_DIR}/node-install-${SAFE_SERVICE}.log'";;
            esac
            jq -e '.scripts.build' package.json >/dev/null 2>&1 && run_cmd "${PM} run build | tee '${LOG_DIR}/node-build-${SAFE_SERVICE}.log'"
            if [ "${RUN_TESTS}" = "true" ] && jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              run_cmd "${PM} test --if-present | tee '${LOG_DIR}/node-test-${SAFE_SERVICE}.log'"
            fi
            [ -d dist ]  && run_cmd "cp -r dist  '${ART_DIR}/node-dist-${SAFE_SERVICE}'"
            [ -d build ] && run_cmd "cp -r build '${ART_DIR}/node-build-${SAFE_SERVICE}'"
          else
            warn "no package.json — skip node"
          fi

      # ========== Java (Maven/Gradle) ==========
      - name: Maven build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if [ -f pom.xml ]; then
            run_cmd "mvn -B -ntp -Dstyle.color=always -DskipTests=$([ \"$RUN_TESTS\" = 'true' ] && echo 'false' || echo 'true') clean package | tee '${LOG_DIR}/maven-${SAFE_SERVICE}.log'"
            find . -type f -path "*/target/*.jar" -exec cp -v {} "${ART_DIR}/" \; || true
          else
            warn "no pom.xml — skip maven"
          fi

      - name: Gradle build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if compgen -G "build.gradle*" >/dev/null; then
            chmod +x ./gradlew 2>/dev/null || true
            if [ -x ./gradlew ]; then
              run_cmd "./gradlew build $([ \"$RUN_TESTS\" = 'false' ] && echo '-x test') | tee '${LOG_DIR}/gradle-${SAFE_SERVICE}.log'"
            else
              run_cmd "gradle build $([ \"$RUN_TESTS\" = 'false' ] && echo '-x test') | tee '${LOG_DIR}/gradle-${SAFE_SERVICE}.log'"
            fi
            find . -type f -path "*/build/libs/*.jar" -exec cp -v {} "${ART_DIR}/" \; || true
          else
            warn "no build.gradle — skip gradle"
          fi

      # ========== Python ==========
      - name: Python build/test (pip/poetry, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            run_cmd "python -m venv .venv && . .venv/bin/activate && python -m pip install -U pip wheel"
            if grep -qiE 'tool\.poetry' pyproject.toml 2>/dev/null; then
              run_cmd "pip install poetry && poetry install --no-interaction | tee '${LOG_DIR}/poetry-${SAFE_SERVICE}.log'"
              [ "${RUN_TESTS}" = "true" ] && run_cmd "poetry run pytest -q | tee '${LOG_DIR}/pytest-${SAFE_SERVICE}.log'"
            else
              if [ -f requirements.txt ]; then
                run_cmd "pip install -r requirements.txt | tee '${LOG_DIR}/pip-${SAFE_SERVICE}.log'"
              fi
              [ -f setup.py ] && run_cmd "python setup.py sdist bdist_wheel | tee '${LOG_DIR}/python-build-${SAFE_SERVICE}.log'"
              [ "${RUN_TESTS}" = "true" ] && run_cmd "pytest -q | tee '${LOG_DIR}/pytest-${SAFE_SERVICE}.log'"
            fi
            find . -type f -path "*/dist/*" -exec cp -v {} "${ART_DIR}/" \; || true
          else
            warn "no python manifest — skip python"
          fi

      # ========== Go ==========
      - name: Go build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if [ -f go.mod ]; then
            run_cmd "go mod download | tee '${LOG_DIR}/go-mod-${SAFE_SERVICE}.log'"
            run_cmd "go build ./... | tee '${LOG_DIR}/go-build-${SAFE_SERVICE}.log'"
            [ "${RUN_TESTS}" = "true" ] && run_cmd "go test ./... -v | tee '${LOG_DIR}/go-test-${SAFE_SERVICE}.log'"
          else
            warn "no go.mod — skip go"
          fi

      # ========== Rust ==========
      - name: Rust build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if [ -f Cargo.toml ]; then
            run_cmd "cargo build --locked | tee '${LOG_DIR}/cargo-build-${SAFE_SERVICE}.log'"
            [ "${RUN_TESTS}" = "true" ] && run_cmd "cargo test --locked | tee '${LOG_DIR}/cargo-test-${SAFE_SERVICE}.log'"
            find . -type f -path "*/target/release/*" -maxdepth 1 -exec cp -v {} "${ART_DIR}/" \; 2>/dev/null || true
          else
            warn "no Cargo.toml — skip rust"
          fi

      # ========== .NET ==========
      - name: .NET build/test (if present, echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if compgen -G "*.sln" >/dev/null || compgen -G "*.csproj" >/dev/null; then
            run_cmd "dotnet restore | tee '${LOG_DIR}/dotnet-restore-${SAFE_SERVICE}.log'"
            run_cmd "dotnet build -c Release | tee '${LOG_DIR}/dotnet-build-${SAFE_SERVICE}.log'"
            [ "${RUN_TESTS}" = "true" ] && run_cmd "dotnet test -c Release --no-build | tee '${LOG_DIR}/dotnet-test-${SAFE_SERVICE}.log'"
            find . -type f -path "*/bin/Release/*" -exec cp -v {} "${ART_DIR}/" \; || true
          else
            warn "no .NET project — skip dotnet"
          fi

      # ========== Docker ==========
      - name: Docker build & tag (echo)
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          REG: ${{ inputs.docker_registry }}
          PREF: ${{ inputs.image_prefix }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if compgen -G "Dockerfile*" > /dev/null; then
            NAME="${PREF}$(basename '${{ env.SERVICE_DIR }}' | tr '[:upper:]' '[:lower:]')"
            IMAGE="${REG}/${NAME}"
            TAG="${IMAGE}:sha-${GITHUB_SHA::7}"
            run_cmd "docker build -t '${TAG}' ."
            echo "${TAG}" > "${LOG_DIR}/image-${SAFE_SERVICE}.txt"
          else
            warn "no Dockerfile* — skip container"
          fi

      - name: Docker login (if push enabled & secrets present)
        if: ${{ inputs.docker_push == 'true' }}
        env:
          REG: ${{ inputs.docker_registry }}
          USER: ${{ secrets.DOCKER_USER || '' }}
          PASS: ${{ secrets.DOCKER_PASS || '' }}
        run: |
          if [ -n "$USER" ] && [ -n "$PASS" ]; then
            echo "$PASS" | docker login "$REG" -u "$USER" --password-stdin
          else
            echo "skip login (no secrets)"
          fi

      - name: SBOM & vulnerability scan (optional, echo)
        if: ${{ inputs.enable_security_scan == 'true' }}
        shell: bash
        run: |
          . /tmp/echo_helpers.sh
          set +e
          for f in "${LOG_DIR}/image-"*.txt 2>/dev/null; do
            [ -s "$f" ] || continue
            TAG="$(cat "$f")"
            base="${f##*/}"; base="${base#image-}"; base="${base%.txt}"
            run_cmd "syft '${TAG}' -o spdx-json > '${ART_DIR}/sbom-${base}.json' || true"
            run_cmd "trivy image --no-progress --format table --timeout 5m '${TAG}' | tee '${LOG_DIR}/trivy-${base}.log'"
            run_cmd "trivy image --no-progress --format json --timeout 5m  '${TAG}' > '${ART_DIR}/trivy-${base}.json' || true"
          done

      - name: Docker push (optional)
        if: ${{ inputs.docker_push == 'true' }}
        shell: bash
        run: |
          . /tmp/echo_helpers.sh
          set +e
          for f in "${LOG_DIR}/image-"*.txt 2>/dev/null; do
            [ -s "$f" ] || continue
            TAG="$(cat "$f")"
            run_cmd "docker push '${TAG}' || echo 'push skipped'"
          done

      # ========== K8s Lint ==========
      - name: K8s manifest lint (optional, echo)
        if: ${{ inputs.k8s_lint == 'true' }}
        shell: bash
        working-directory: ${{ env.SERVICE_DIR }}
        run: |
          . /tmp/echo_helpers.sh
          set +e
          if command -v kubeconform >/dev/null 2>&1 && ls k8s kubernetes -d 1>/dev/null 2>&1; then
            run_cmd "find k8s kubernetes -type f \\( -name '*.yml' -o -name '*.yaml' \\) -print0 2>/dev/null | xargs -0 -I{} kubeconform -summary -output json {} | tee '${LOG_DIR}/kubeconform-${SAFE_SERVICE}.json'"
          else
            warn "kubeconform not ready or no k8s dir — skip"
          fi

      - name: Upload per-service artifacts/logs (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-${{ env.SAFE_SERVICE }}
          path: |
            ${{ env.ART_DIR }}/**
            ${{ env.DL_DIR }}/**
            ${{ env.LOG_DIR }}/echo-${{ env.SAFE_SERVICE }}.log
            ${{ env.LOG_DIR }}/node-*.log
            ${{ env.LOG_DIR }}/maven-*.log
            ${{ env.LOG_DIR }}/gradle-*.log
            ${{ env.LOG_DIR }}/python-*.log
            ${{ env.LOG_DIR }}/poetry-*.log
            ${{ env.LOG_DIR }}/pytest-*.log
            ${{ env.LOG_DIR }}/go-*.log
            ${{ env.LOG_DIR }}/cargo-*.log
            ${{ env.LOG_DIR }}/dotnet-*.log
            ${{ env.LOG_DIR }}/trivy-*.log
            ${{ env.LOG_DIR }}/kubeconform-*.json
            ${{ env.LOG_DIR }}/image-*.txt
          if-no-files-found: ignore
          retention-days: 14

  collect:
    name: "Collector — final summary / logs (always)"
    needs: [guard, discover, service]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap dirs & echo files (safe)
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${RUNNER_TEMP:=/tmp}"
          LOG_DIR="${RUNNER_TEMP}/runtime-logs"
          ART_DIR="${RUNNER_TEMP}/artifacts"
          DL_DIR="${RUNNER_TEMP}/downloads"
          ECHO_DIR=".github/echo"
          mkdir -p "$LOG_DIR" "$DL_DIR"
          : > "$LOG_DIR/.keep"; : > "$DL_DIR/.keep"
          {
            echo "LOG_DIR=$LOG_DIR"
            echo "ART_DIR=$ART_DIR"
            echo "DL_DIR=$DL_DIR"
            echo "ECHO_DIR=$ECHO_DIR"
          } >> "$GITHUB_ENV"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## EchoOps MAX — Summary"
            echo "- Actor: **${{ github.actor }}**"
            echo "- Workflow: **${{ github.workflow }}**"
            echo "- Ref: **${{ github.ref }}**"
            echo "- Run ID: **${{ github.run_id }}**"
            echo ""
            echo "### Download Manifests"
            echo "- Root: \`${{ inputs.download_manifest_root }}\` (exists: $( [ -f "${GITHUB_WORKSPACE}/${{ inputs.download_manifest_root }}" ] && echo yes || echo no ))"
            echo "- Per-service: \`<service>/downloads.txt\` if any"
            echo ""
            echo "### Options"
            echo "- Security scan: **${{ inputs.enable_security_scan }}**"
            echo "- Docker push: **${{ inputs.docker_push }}**"
            echo "- K8s lint: **${{ inputs.k8s_lint }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final logs (always)
        uses: actions/upload-artifact@v4
        with:
          name: all-logs
          path: ${{ env.LOG_DIR }}/*
          if-no-files-found: ignore
          retention-days: 14
